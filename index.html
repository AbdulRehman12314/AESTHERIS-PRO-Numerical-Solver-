<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS PRO | Secure Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00d4ff;
            --error-neon: #ff3b3b;
            --dark-bg: #020406;
            --border: rgba(0, 212, 255, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 212, 255, 0.04) 0%, transparent 80%);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #bg-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.3;
            z-index: 1;
        }

        .portal-content {
            position: relative;
            z-index: 5;
            text-align: center;
            max-width: 550px;
            width: 100%;
            padding: 40px;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 212, 255, 0.05);
        }

        .portal-logo-area {
            margin-bottom: 20px;
        }
        .portal-logo-area img {
            height: 70px;
            width: auto;
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.4));
        }

        .portal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            margin: 15px 0 5px 0;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #fff 0%, var(--neon) 50%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .portal-tagline {
            font-size: 1rem;
            color: #a0aec0;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        /* PASSWORD INTERFACE FIELD */
        .secure-input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .secure-input-group label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: var(--neon);
            letter-spacing: 2px;
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .pass-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border);
            padding: 14px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 4px;
            border-radius: 8px;
            text-align: center;
            transition: var(--transition);
        }
        .pass-field:focus {
            border-color: var(--neon);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.25);
            outline: none;
        }

        /* ERROR PROMPT TRANSITION */
        #error-msg {
            color: var(--error-neon);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
            min-height: 18px;
            opacity: 0;
            transition: var(--transition);
            text-shadow: 0 0 8px rgba(255, 59, 59, 0.3);
        }

        .boot-btn {
            width: 100%;
            background: transparent;
            border: 2px solid var(--neon);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 900;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 3px;
            transition: var(--transition);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
            text-transform: uppercase;
        }

        .boot-btn:hover {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 25px var(--neon);
        }

        .system-status-row {
            margin-top: 35px;
            display: flex;
            gap: 20px;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1px;
            border-top: 1px solid rgba(0, 212, 255, 0.08);
            padding-top: 15px;
        }
        .status-node span { color: var(--neon); }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="portal-content">
        <div class="portal-logo-area">
            <img src="Gemini_Generated_Image_22jgs622jgs622jg.png" alt="NEXUS PRO">
        </div>

        <h1 class="portal-title">NEXUS CORE</h1>
        <p class="portal-tagline">Enter clearance key to initialize universal engine matrix.</p>
        
        <div class="secure-input-group">
            <label>Security Access Token</label>
            <input type="password" id="gateKey" class="pass-field" placeholder="••••••••" onkeydown="checkEnterKey(event)">
        </div>

        <div id="error-msg"></div>

        <button class="boot-btn" onclick="validateAccessGate()">
            Authenticate & Boot
        </button>

        <div class="system-status-row">
            <div class="status-node">Gateway: <span>ENCRYPTED</span></div>
            <div class="status-node">Node: <span>SECURE</span></div>
        </div>
    </div>

    <script>
        // CLIENT ACCESS CONTROL MATRIX
        const SECURITY_CONFIG = {
            targetToken: "786123"  // <--- Bhai yahan apna password badal sakte hain
        };

        function validateAccessGate() {
            const inputField = document.getElementById('gateKey');
            const errorDiv = document.getElementById('error-msg');
            const btn = document.querySelector('.boot-btn');

            if (inputField.value === SECURITY_CONFIG.targetToken) {
                errorDiv.style.opacity = "0";
                inputField.style.borderColor = "var(--neon)";
                btn.innerHTML = "ACCESS GRANTED. BOOTING...";
                btn.style.background = "var(--neon)";
                btn.style.color = "#000";
                
                setTimeout(() => {
                    location.href = 'app.html';
                }, 800);
            } else {
                // Trigger Warning State Architecture
                errorDiv.innerHTML = "⚠️ ACCESS DENIED: INVALID CLEARANCE KEY";
                errorDiv.style.opacity = "1";
                inputField.style.borderColor = "var(--error-neon)";
                inputField.value = "";
                inputField.focus();
                
                // Shake effect simulate karne ke liye simple timeout
                setTimeout(() => {
                    inputField.style.borderColor = "var(--border)";
                }, 1000);
            }
        }

        function checkEnterKey(event) {
            if (event.key === "Enter") {
                validateAccessGate();
            }
        }

        // BACKGROUND CANVA ENGINE
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.2 + 0.5;
                this.speedX = Math.random() * 0.3 - 0.15;
                this.speedY = Math.random() * 0.3 - 0.15;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0; if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0; if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 212, 255, 0.2)';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        for (let i = 0; i < 60; i++) particles.push(new Particle());
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
